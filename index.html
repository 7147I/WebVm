<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebVM 11 — Hypervisor</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep: #0a0a0a; --bg-glass: rgba(32, 32, 32, 0.6); --bg-glass-strong: rgba(20, 20, 20, 0.85);
  --border-glass: rgba(255, 255, 255, 0.1); --text: #eef2f8; --text-muted: #8493a8;
  --accent: #0067c0; --accent-light: #4cc2ff; --accent-glow: rgba(76, 194, 255, 0.4);
  --success: #34e89e; --danger: #ff4d6d; --brave-orange: #FB542B;
}
html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif; }
body { background: var(--bg-deep); color: var(--text); -webkit-font-smoothing: antialiased; }
#app { height: 100vh; position: relative; }

.view { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; overflow: hidden; }
.view.active { opacity: 1; pointer-events: all; }

/* --- ISO Drop View --- */
.iso-drop-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; background: radial-gradient(circle at 50% 50%, #152238, #000); }
.iso-drop-zone { width: 100%; max-width: 600px; padding: 60px 40px; text-align: center; background: var(--bg-glass); border: 2px dashed var(--border-glass); border-radius: 16px; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(20px); }
.iso-drop-zone:hover, .iso-drop-zone.drag-over { border-color: var(--accent-light); background: rgba(76,194,255,0.06); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(76,194,255,0.1); }
.iso-drop-zone h2 { font-size: 24px; margin-bottom: 10px; }
.iso-drop-zone p { color: var(--text-muted); font-size: 14px; }
.boot-iso-btn { margin-top: 30px; padding: 14px 40px; font-size: 16px; font-weight: 700; background: linear-gradient(135deg, var(--accent-light), var(--accent)); color: #000; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 8px 24px rgba(76,194,255,0.3); transition: transform 0.2s; }
.boot-iso-btn:hover { transform: translateY(-2px); }

/* --- Boot & Setup --- */
.boot-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; color: #fff; font-family: 'Courier New', monospace; opacity: 0; transition: opacity 0.4s; }
.boot-stage.active { opacity: 1; }
.bios-text { font-size: 14px; line-height: 1.8; width: 80%; max-width: 800px; }
.bios-text .ok { color: var(--success); }
.winboot-logo { width: 100px; height: 100px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 40px; animation: winPulse 2s infinite ease-in-out; }
.winboot-logo div { background: #4cc2ff; border-radius: 2px; }
@keyframes winPulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
.spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #4cc2ff; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.setup-screen { background: #001a33; color: #fff; padding: 40px; }
.setup-header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
.setup-header svg { width: 40px; height: 40px; }
.setup-header h1 { font-size: 24px; font-weight: 300; }
.setup-body { background: rgba(0,0,0,0.3); padding: 30px; border-radius: 4px; min-width: 500px; max-width: 600px; backdrop-filter: blur(10px); }
.setup-step { font-size: 14px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; opacity: 0; transform: translateY(10px); animation: fadeInUp 0.4s forwards; }
@keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
.setup-progress { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; margin-top: 20px; }
.setup-progress .fill { height: 100%; width: 0%; background: #4cc2ff; transition: width 0.3s; }

/* --- Desktop --- */
.desktop-stage { position: absolute; inset: 0; background: radial-gradient(circle at 0% 0%, #2a2a72, #0a0a0a); background-size: cover; background-position: center; overflow: hidden; transition: background 0.5s; filter: invert(var(--dark-mode-invert, 0)); }
.desktop-icons { position: absolute; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 10; flex-wrap: wrap; max-height: 80%; }
.desktop-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 80px; padding: 8px 4px; cursor: pointer; border-radius: 6px; border: 1px solid transparent; transition: all 0.2s ease; }
.desktop-icon:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.1); transform: translateY(-2px); backdrop-filter: blur(10px); }
.desktop-icon svg { width: 32px; height: 32px; transition: transform 0.2s; }
.desktop-icon:hover svg { transform: scale(1.1); }
.desktop-icon span { font-size: 12px; color: #fff; text-align: center; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

/* --- Taskbar --- */
.taskbar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); height: 52px; background: var(--bg-glass); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border: 1px solid var(--border-glass); border-radius: 26px; display: flex; align-items: center; padding: 0 12px; gap: 8px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
.start-btn { width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; border-radius: 6px; color: #fff; transition: all 0.2s; }
.start-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }
.taskbar-items { display: flex; gap: 8px; }
.taskbar-item { width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; border-radius: 6px; position: relative; transition: all 0.2s; }
.taskbar-item:hover { background: rgba(255,255,255,0.1); }
.taskbar-item.active { background: rgba(255,255,255,0.15); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); }
.taskbar-item.active::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 12px; height: 3px; background: var(--accent-light); border-radius: 2px; }
.taskbar-tray { display: flex; align-items: center; gap: 10px; padding: 0 10px; color: #fff; font-size: 11px; cursor: pointer; border-left: 1px solid rgba(255,255,255,0.1); margin-left: 8px; }
.tray-clock { text-align: right; line-height: 1.2; }
.taskbar-widgets { display: flex; align-items: center; gap: 10px; padding: 0 10px; color: #fff; font-size: 11px; cursor: pointer; border-right: 1px solid rgba(255,255,255,0.1); margin-right: 8px; }
.taskbar-widgets span { display: flex; align-items: center; gap: 5px; }

/* --- Start Menu --- */
.start-menu { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(20px); width: 600px; max-width: 90%; height: 450px; background: var(--bg-glass-strong); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border: 1px solid var(--border-glass); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: none; flex-direction: column; z-index: 999; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); padding: 30px; }
.start-menu.visible { display: flex; transform: translateX(-50%) translateY(0); opacity: 1; }
.start-search { width: 100%; padding: 10px 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; color: #fff; font-size: 14px; outline: none; margin-bottom: 20px; }
.start-tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; flex: 1; align-content: start; overflow-y: auto; }
.start-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 15px 5px; cursor: pointer; border-radius: 6px; font-size: 12px; color: #fff; transition: all 0.2s; }
.start-tile:hover { background: rgba(255,255,255,0.08); transform: scale(1.05); }
.start-tile svg { width: 28px; height: 28px; }

/* --- Flyouts (Widgets / Quick Settings) --- */
.flyout { position: absolute; bottom: 70px; background: var(--bg-glass-strong); backdrop-filter: blur(40px) saturate(180%); border: 1px solid var(--border-glass); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: none; flex-direction: column; z-index: 999; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); padding: 20px; color: #fff; width: 360px; }
.flyout.visible { display: flex; opacity: 1; }
.flyout-widgets { left: 10px; }
.flyout-quick { right: 10px; }
.widget-card { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
.widget-card h4 { margin-bottom: 10px; color: var(--accent-light); }
.qs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
.qs-btn { background: rgba(255,255,255,0.05); border: none; color: #fff; padding: 15px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; transition: background 0.2s; }
.qs-btn:hover { background: rgba(255,255,255,0.1); }
.qs-btn.active { background: var(--accent); }
.qs-slider { width: 100%; margin-top: 10px; }

/* --- Window Manager --- */
.vm-window { position: absolute; min-width: 300px; min-height: 200px; background: var(--bg-glass-strong); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border: 1px solid var(--border-glass); border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: visible; opacity: 0; transform: scale(0.95); transition: opacity 0.2s, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.vm-window.active { opacity: 1; transform: scale(1); box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(76,194,255,0.1); }
.window-titlebar { height: 40px; padding: 0 8px 0 16px; display: flex; align-items: center; color: #fff; font-size: 13px; font-weight: 600; cursor: grab; background: transparent; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
.window-titlebar:active { cursor: grabbing; }
.window-titlebar .icon { width: 16px; height: 16px; margin-right: 10px; flex-shrink: 0; }
.window-controls { margin-left: auto; display: flex; height: 100%; }
.window-btn { width: 46px; height: 100%; display: grid; place-items: center; color: #fff; cursor: pointer; transition: all 0.2s; position: relative; }
.window-btn:hover { background: rgba(255,255,255,0.1); }
.window-btn.close:hover { background: #e81123; }
.window-content { flex: 1; overflow: hidden; background: #1e1e1e; position: relative; display: flex; flex-direction: column; border-radius: 0 0 8px 8px; }

/* Resize handles */
.resize-handle { position: absolute; z-index: 5; }
.resize-handle.n { top: -3px; left: 6px; right: 6px; height: 6px; cursor: ns-resize; }
.resize-handle.s { bottom: -3px; left: 6px; right: 6px; height: 6px; cursor: ns-resize; }
.resize-handle.e { top: 6px; right: -3px; bottom: 6px; width: 6px; cursor: ew-resize; }
.resize-handle.w { top: 6px; left: -3px; bottom: 6px; width: 6px; cursor: ew-resize; }
.resize-handle.ne { top: -3px; right: -3px; width: 12px; height: 12px; cursor: nesw-resize; }
.resize-handle.nw { top: -3px; left: -3px; width: 12px; height: 12px; cursor: nwse-resize; }
.resize-handle.se { bottom: -3px; right: -3px; width: 12px; height: 12px; cursor: nwse-resize; }
.resize-handle.sw { bottom: -3px; left: -3px; width: 12px; height: 12px; cursor: nesw-resize; }

/* Snap Layouts */
.snap-layout { position: absolute; top: 40px; right: 46px; background: var(--bg-glass-strong); backdrop-filter: blur(40px); border: 1px solid var(--border-glass); border-radius: 8px; padding: 10px; display: none; grid-template-columns: 1fr 1fr; gap: 10px; z-index: 1000; }
.snap-layout.visible { display: grid; }
.snap-option { width: 80px; height: 50px; border: 1px solid #555; border-radius: 4px; cursor: pointer; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; padding: 2px; }
.snap-option:hover { border-color: var(--accent-light); }
.snap-option div { background: #555; border-radius: 2px; transition: background 0.2s; }
.snap-option:hover div.active { background: var(--accent-light); }

/* --- App Styles --- */
.generic-app { height: 100%; padding: 20px; color: #fff; overflow-y: auto; background: rgba(20,20,20,0.9); }
.brave-toolbar { background: #202124; padding: 8px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #3c4043; }
.brave-btn { background: #3c4043; border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; font-size: 16px; transition: all 0.2s; flex-shrink: 0; }
.brave-btn:hover { background: #4d4d4d; }
.brave-input { flex: 1; background: #3c4043; border: 1px solid #4d4d4d; color: #fff; padding: 8px 16px; border-radius: 20px; outline: none; font-size: 14px; min-width: 0; }
.brave-input:focus { border-color: var(--brave-orange); }
.brave-iframe { flex: 1; width: 100%; border: none; background: #fff; }
.brave-tabs { display: flex; background: #17181a; padding: 6px 6px 0; gap: 4px; overflow-x: auto; }
.brave-tab { display: flex; align-items: center; gap: 6px; background: #2b2c2f; color: #ccc; padding: 6px 10px; border-radius: 8px 8px 0 0; font-size: 12px; cursor: pointer; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
.brave-tab.active { background: #202124; color: #fff; }
.brave-tab .tab-close { margin-left: 4px; opacity: 0.6; }
.brave-tab .tab-close:hover { opacity: 1; color: var(--danger); }
.brave-newtab-btn { background: #2b2c2f; color: #ccc; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; margin-bottom: 4px; }
.brave-newtab-btn:hover { background: #3c4043; }
.brave-home { height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 60px; background: #202124; color: #fff; overflow-y: auto; }
.brave-home input { width: 500px; max-width: 80%; padding: 14px 20px; border-radius: 24px; border: none; background: #3c4043; color: #fff; font-size: 15px; outline: none; margin-bottom: 30px; }
.brave-home-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; width: 500px; max-width: 80%; }
.brave-home-tile { background: #2b2c2f; border-radius: 10px; padding: 16px 8px; text-align: center; cursor: pointer; font-size: 12px; transition: background 0.2s; }
.brave-home-tile:hover { background: #3c4043; }
.brave-home-tile .fav { font-size: 22px; margin-bottom: 6px; }
.brave-blocked { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #202124; color: #ccc; gap: 14px; padding: 20px; text-align: center; }
.brave-blocked a { color: var(--accent-light); }
.brave-frame-wrap { position: relative; flex: 1; display: flex; }
.brave-spinner-overlay { position: absolute; inset: 0; background: #202124; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #999; font-size: 13px; z-index: 2; transition: opacity 0.2s; pointer-events: none; }
.brave-spinner-overlay .spin { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.15); border-top-color: var(--brave-orange); border-radius: 50%; animation: spin 0.8s linear infinite; }
.brave-embed-hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(20,20,20,0.9); color: #ccc; font-size: 11px; padding: 6px 12px; border-radius: 14px; z-index: 3; display: flex; gap: 8px; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
.brave-embed-hint a { color: var(--accent-light); text-decoration: none; font-weight: 600; }

.terminal-app { height: 100%; padding: 16px; font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 14px; color: #ddd; overflow-y: auto; display: flex; flex-direction: column; cursor: text; background: #0c0c0c; }
.terminal-output { flex: 1; overflow-y: auto; margin-bottom: 8px; }
.terminal-line { white-space: pre-wrap; word-break: break-all; line-height: 1.5; margin-bottom: 4px; }
.terminal-input-line { display: flex; align-items: center; }
.terminal-prompt { color: var(--success); margin-right: 8px; white-space: nowrap; }
.terminal-input { flex: 1; background: transparent; border: none; outline: none; color: #ddd; font-family: inherit; font-size: inherit; }

.calc-app { height: 100%; display: flex; flex-direction: column; background: #1e1e1e; padding: 10px; }
.calc-display { background: #111; color: #fff; padding: 15px; font-size: 24px; text-align: right; border-radius: 4px; margin-bottom: 10px; font-family: monospace; }
.calc-grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.calc-btn { background: #333; color: #fff; border: none; font-size: 18px; border-radius: 4px; cursor: pointer; transition: all 0.1s; display:grid; place-items:center; }
.calc-btn:hover { background: #444; }
.calc-btn:active { transform: scale(0.95); }
.calc-btn.op { background: #555; }
.calc-btn.eq { background: var(--accent-light); color: #000; }

.paint-app { height: 100%; display: flex; flex-direction: column; background: #1e1e1e; }
.paint-toolbar { background: #2d2d2d; padding: 5px; display: flex; gap: 10px; border-bottom: 1px solid #444; align-items: center; }
.paint-canvas { flex: 1; background: #fff; cursor: crosshair; }

.piano-app { height: 100%; display: flex; flex-direction: column; background: #1e1e1e; }
.piano-keys { flex: 1; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px; position: relative; }
.piano-key { width: 60px; height: 200px; background: #fff; border: 1px solid #333; border-radius: 0 0 6px 6px; cursor: pointer; transition: background 0.1s; }
.piano-key:hover { background: #ddd; }
.piano-key.black { width: 40px; height: 120px; background: #111; margin: 0 -20px; z-index: 2; border-radius: 0 0 4px 4px; }
.piano-key.black:hover { background: #333; }

.notepad-menu { background: #2d2d2d; padding: 5px 10px; font-size: 12px; color: #ccc; border-bottom: 1px solid #444; display: flex; gap: 15px; align-items: center; }
.notepad-menu .np-action { cursor: pointer; padding: 3px 8px; border-radius: 4px; }
.notepad-menu .np-action:hover { background: rgba(255,255,255,0.1); }
.notepad-menu .np-status { margin-left: auto; color: #888; font-size: 11px; }
.notepad-textarea { flex: 1; background: #1e1e1e; color: #ddd; border: none; outline: none; padding: 16px; font-family: 'Consolas', monospace; font-size: 14px; resize: none; line-height: 1.5; }

.taskmgr-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #333; font-size: 14px; }
.taskmgr-kill { background: #ff4d6d; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }

/* Explorer */
.explorer-app { height: 100%; display: flex; flex-direction: column; background: #1e1e1e; color: #fff; }
.explorer-body { flex: 1; display: flex; overflow: hidden; }
.explorer-sidebar { width: 200px; background: #111; padding: 10px; border-right: 1px solid #444; flex-shrink: 0; overflow-y: auto; }
.explorer-sidebar .es-item { cursor: pointer; padding: 6px 4px; border-radius: 4px; font-size: 13px; }
.explorer-sidebar .es-item:hover { background: rgba(255,255,255,0.08); }
.explorer-main { flex: 1; padding: 20px; overflow-y: auto; align-content: flex-start; }
.explorer-item { display: inline-flex; flex-direction: column; align-items: center; width: 84px; margin: 8px; cursor: pointer; padding: 6px; border-radius: 6px; text-align: center; }
.explorer-item:hover { background: rgba(255,255,255,0.08); }
.explorer-item svg { width: 40px; height: 40px; margin-bottom: 5px; }
.explorer-item span { font-size: 12px; word-break: break-word; }
.explorer-toolbar { background: #2d2d2d; padding: 8px 10px; border-bottom: 1px solid #444; display: flex; gap: 8px; align-items: center; }
.explorer-path { background: #2d2d2d; padding: 10px; border-bottom: 1px solid #444; display: flex; gap: 10px; align-items: center; }
.explorer-path input { flex: 1; background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 5px 10px; border-radius: 4px; outline: none; }
.explorer-toolbtn { background: #3c4043; border: none; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.explorer-toolbtn:hover { background: #4d4d4d; }

/* VS Code */
.vscode-app { height: 100%; display: flex; background: #1e1e1e; color: #fff; }
.vscode-sidebar { width: 200px; background: #111; padding: 10px; border-right: 1px solid #444; }
.vscode-main { flex: 1; display: flex; flex-direction: column; }
.vscode-editor { flex: 1; background: #1e1e1e; color: #ddd; border: none; outline: none; padding: 16px; font-family: 'Consolas', monospace; font-size: 14px; resize: none; line-height: 1.5; }
.vscode-preview { flex: 1; background: #fff; border: none; }

.wp-option { width: 100%; height: 80px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
.wp-option:hover { border-color: var(--accent-light); transform: scale(1.02); }

/* Photos / PDF viewer */
.photos-app { height: 100%; display: flex; align-items: center; justify-content: center; background: #111; }
.photos-app img { max-width: 100%; max-height: 100%; }
.pdf-app { height: 100%; background: #525659; }
.pdf-app iframe, .pdf-app object { width: 100%; height: 100%; border: none; }

/* Sticky Notes */
.notes-app { height: 100%; background: #2d2d2d; padding: 14px; overflow-y: auto; }
.notes-toolbar { margin-bottom: 12px; }
.notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.sticky-note { background: #fff59d; color: #222; border-radius: 6px; padding: 10px; min-height: 140px; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.sticky-note textarea { flex: 1; background: transparent; border: none; outline: none; resize: none; font-family: inherit; font-size: 13px; color: #222; }
.sticky-note .sn-del { align-self: flex-end; cursor: pointer; font-size: 11px; color: #664; opacity: 0.7; }
.sticky-note .sn-del:hover { opacity: 1; }

/* Recycle Bin */
.recycle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #333; font-size: 13px; }
.recycle-actions button { margin-left: 6px; background: #3c4043; border: none; color: #fff; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.recycle-actions button:hover { background: #4d4d4d; }

.context-menu { position: absolute; background: var(--bg-glass-strong); backdrop-filter: blur(40px); border: 1px solid var(--border-glass); border-radius: 8px; padding: 6px; min-width: 180px; z-index: 10000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

.ctx-item { padding: 8px 12px; font-size: 13px; color: #fff; cursor: pointer; border-radius: 4px; }
.ctx-item:hover { background: rgba(255,255,255,0.1); }

.toast { position: fixed; bottom: 70px; right: 20px; padding: 12px 24px; background: var(--bg-glass-strong); backdrop-filter: blur(40px); border: 1px solid var(--border-glass); border-radius: 8px; font-size: 13px; opacity: 0; transform: translateX(20px); pointer-events: none; transition: all 0.3s; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.3); color: #fff; }
.toast.visible { opacity: 1; transform: translateX(0); }
.hidden { display: none !important; }

/* Lock Screen */
.lock-screen { position: absolute; inset: 0; z-index: 5000; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; cursor: pointer; user-select: none; transition: transform 0.4s ease, opacity 0.4s ease; }
.lock-screen.hidden-lock { transform: translateY(-100%); opacity: 0; pointer-events: none; }

/* Alt+Tab Switcher */
.alttab-overlay { position: fixed; inset: 0; z-index: 6000; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; backdrop-filter: blur(6px); }

.alttab-item span { font-size: 11px; color: #fff; text-align: center; }

/* Explorer multi-select & drag-over */

.explorer-main.drag-over, .desktop-icons.drag-over { outline: 2px dashed var(--accent-light); outline-offset: -4px; background: rgba(76,194,255,0.06); }
.desktop-icon.selected { background: rgba(76,194,255,0.2); border-color: var(--accent-light); }

/* Debug Mode */
.debug-overlay { position: fixed; bottom: 70px; left: 10px; z-index: 99999; background: rgba(0,0,0,0.85); color: #34e89e; font-family: 'Consolas', monospace; font-size: 11px; line-height: 1.6; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(52,232,158,0.4); pointer-events: none; white-space: nowrap; }
body.debug-mode .vm-window { outline: 1px dashed #ff4d6d; outline-offset: 2px; }
body.debug-mode .vm-window .window-content { outline: 1px dotted rgba(76,194,255,0.5); outline-offset: -1px; }
body.debug-mode .desktop-icon { outline: 1px dotted rgba(255,159,67,0.5); }

/* Security screen (Ctrl+Alt+Del) */
.security-screen { position: absolute; inset: 0; z-index: 5500; background: rgba(15,32,39,0.97); backdrop-filter: blur(10px); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.security-screen.visible { display: flex; }
.security-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 14px 40px; border-radius: 6px; font-size: 15px; cursor: pointer; width: 260px; text-align: left; transition: background 0.15s; }
.security-btn:hover { background: rgba(255,255,255,0.14); }

/* Show Desktop corner */

.show-desktop-corner:hover { background: rgba(255,255,255,0.15); border-left: 1px solid rgba(255,255,255,0.3); }

/* Selection rubber-band */
.select-box { position: absolute; border: 1px solid var(--accent-light); background: rgba(76,194,255,0.12); z-index: 900; pointer-events: none; }

/* --- Future Cursor pack (macOS-style theme) --- */
html, body { cursor: var(--cur-normal); }
button, .desktop-icon, .start-btn, .start-tile, .taskbar-item, .taskbar-tray, .taskbar-widgets,
.qs-btn, .brave-btn, .brave-tab, .brave-newtab-btn, .brave-home-tile, .explorer-item, .es-item,
.window-btn, .ctx-item, .wp-option, .calc-btn, .np-action, .snap-option, .security-btn,

input[type="text"], input[type="search"], input[type="number"], textarea, .brave-input,
.start-search, .explorer-path input, .terminal-input { cursor: var(--cur-text) !important; }
input[type="color"] { cursor: var(--cur-colorpicker) !important; }

  html, body, * { cursor: none !important; }
}

<body>

        <svg viewBox="0 0 100 100" style="width: 40px; height: 40px;"><path fill="#4cc2ff" d="M12 18 L44 12 L44 46 L12 46 Z"/><path fill="#4cc2ff" d="M48 11 L88 5 L88 46 L48 46 Z"/><path fill="#4cc2ff" d="M12 54 L44 54 L44 88 L12 82 Z"/><path fill="#4cc2ff" d="M48 54 L88 54 L88 95 L48 89 Z"/></svg>
        <h1>WebVM Setup</h1>

      <div class="setup-header">
        <svg viewBox="0 0 100 100" style="width: 40px; height: 40px;"><path fill="#4cc2ff" d="M12 18 L44 12 L44 46 L12 46 Z"/><path fill="#4cc2ff" d="M48 11 L88 5 L88 46 L48 46 Z"/><path fill="#4cc2ff" d="M12 54 L44 54 L44 88 L12 82 Z"/><path fill="#4cc2ff" d="M48 54 L88 54 L88 95 L48 89 Z"/></svg>
        <h1>Who's using this VM?</h1>
      </div>
      <div class="setup-body">
        <p style="margin-bottom:14px; color:#cdd6e0; font-size:13px;">This name is used for Sticky Notes, Discord messages sent from the terminal, and a couple of other places.</p>
        <input type="text" id="boot-name-input" placeholder="Enter your name" maxlength="24" style="width:100%; padding:12px 14px; border-radius:6px; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.06); color:#fff; font-size:15px; outline:none; margin-bottom:16px;" onkeydown="if(event.key==='Enter') submitBootName()">

</div>

<div class="alttab-overlay" id="alttab-overlay"><div class="alttab-list" id="alttab-list"></div></div>

<input type="file" id="video-upload-input" class="hidden" accept="video/*">

<script src="config.js"></script>
<script>
// --- VFS (Virtual File System) ---
const VFS = {
  fs: { 'C:': { 'Users': { 'Admin': { 'Desktop': {}, 'Documents': { 'readme.txt': 'Welcome to WebVM!\n\nThis is a simulated file system running entirely in your browser.' } }, 'Windows': {}, 'Program Files': {} } } },
  path: ['C:', 'Users', 'Admin'],
  trash: [],
  resolve(p) {
    if (!p) return [...this.path];
    if (p.startsWith('C:')) return p.split('\\').filter(Boolean);
    if (p === '..') return this.path.slice(0, -1);
    return [...this.path, ...p.split('\\').filter(Boolean)];
  },
  node(arr) {
    let node = this.fs;
    for (let i = 1; i < arr.length; i++) { if (!node[arr[i]]) return null; node = node[arr[i]]; }
    return node;
  },
  list(p) { const n = this.node(this.resolve(p)); return n ? Object.keys(n).map(k => ({ name: k, isDir: typeof n[k] !== 'string', content: typeof n[k] === 'string' ? n[k] : null })) : null; },
  read(p) { const n = this.node(this.resolve(p)); return typeof n === 'string' ? n : null; },
  write(p, c) { const arr = this.resolve(p); const name = arr.pop(); const n = this.node(arr); if (n) n[name] = c; },
  mkdir(p) { const arr = this.resolve(p); const name = arr.pop(); const n = this.node(arr); if (n) n[name] = {}; },
  rename(p, newName) { const arr = this.resolve(p); const name = arr.pop(); const n = this.node(arr); if (n && n[name] !== undefined) { n[newName] = n[name]; delete n[name]; } },
  del(p, toTrash) {
    const arr = this.resolve(p); const name = arr.pop(); const n = this.node(arr);
    if (n && n[name] !== undefined) {
      if (toTrash) this.trash.push({ name, content: n[name], from: arr.join('\\') });
      delete n[name];
    }
  },
  exists(p) { const arr = this.resolve(p); const name = arr.pop(); const n = this.node(arr); return n && n[name] !== undefined; }
};

const HostSystem = { init() { this.cores = navigator.hardwareConcurrency || 'Unknown'; this.ram = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Unknown'; } };
let state = { isoName: 'None', setupSize: 0, isAdmin: false, awaitingPassword: false, darkMode: false, adminUnlocked: false, snapshots: [], sshHost: null, userName: 'Admin' };
let simUserRoles = { Admin: 'Administrator', Guest: 'Guest' };
let firewallRules = [
  { name: 'Core Networking - DNS (UDP-Out)', dir: 'Out', action: 'Allow', port: '53' },
  { name: 'File and Printer Sharing (SMB-In)', dir: 'In', action: 'Block', port: '445' },
  { name: 'Remote Desktop (TCP-In)', dir: 'In', action: 'Block', port: '3389' },
  { name: 'World Wide Web Services (HTTP-In)', dir: 'In', action: 'Allow', port: '80,443' }
];
let envVars = { OS: 'Windows_NT', PROCESSOR_ARCHITECTURE: 'AMD64', USERPROFILE: 'C:\\Users\\Admin', TEMP: 'C:\\Users\\Admin\\AppData\\Local\\Temp', NUMBER_OF_PROCESSORS: '4' };
let zCounter = 100;
let openWindows = {};
let isoFileObj = null;
let audioCtx = null;
let notepadOpenPath = null;
let vfsClipboard = null; // { name, content, isDir, cut, from }

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('visible'); t.style.transform = 'translateX(0)'; clearTimeout(t._tid); t._tid = setTimeout(() => { t.classList.remove('visible'); t.style.transform = 'translateX(20px)'; }, 3000); }
function switchView(id) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// --- ISO Parser ---
const SECTOR_SIZE = 2048;
function read32LE(buf, off) { return buf[off] | (buf[off+1] << 8) | (buf[off+2] << 16) | (buf[off+3] << 24); }
async function parseIso9660(file) {
  if (!file) return null;
  try {
    const pvdBuffer = await file.slice(16 * SECTOR_SIZE, 17 * SECTOR_SIZE).arrayBuffer();
    const pvd = new Uint8Array(pvdBuffer);
    if (pvd[1] !== 0x43 || pvd[2] !== 0x44 || pvd[3] !== 0x30 || pvd[4] !== 0x30 || pvd[5] !== 0x31) return null;
    const rootRec = pvd.subarray(156, 156 + 34);
    return { rootLba: read32LE(rootRec, 2), rootSize: read32LE(rootRec, 10) };
  } catch (e) { return null; }
}
async function buildIsoTree(file, lba, size, depth = 0) {
  if (depth > 2) return {};
  const entries = {};
  try {
    const buffer = await file.slice(lba * SECTOR_SIZE, lba * SECTOR_SIZE + size).arrayBuffer();
    const buf = new Uint8Array(buffer);
    let pos = 0, count = 0;
    while (pos < buf.length && count < 500) {
      const len = buf[pos];
      if (len === 0) { const nextSector = Math.floor(pos / SECTOR_SIZE) * SECTOR_SIZE + SECTOR_SIZE; pos = nextSector <= pos ? pos + 1 : nextSector; if (pos >= buf.length) break; continue; }
      const lbaLE = read32LE(buf, pos + 2), dataLenLE = read32LE(buf, pos + 10), flags = buf[pos + 25], nameLen = buf[pos + 32];
      if (pos + 33 + nameLen > buf.length) break;
      let name = String.fromCharCode.apply(null, buf.subarray(pos + 33, pos + 33 + nameLen));
      if (name !== '\x00' && name !== '\x01') {
        name = name.replace(/;1$/, '');
        const isDir = (flags & 0x02) !== 0;
        if (isDir) { if (lbaLE !== lba) entries[name] = await buildIsoTree(file, lbaLE, dataLenLE, depth + 1); else entries[name] = {}; }
        else { entries[name] = { lba: lbaLE, size: dataLenLE, path: name }; }
        count++;
      }
      pos += len;
    }
  } catch (e) {}
  return entries;
}
function findFileByName(node, name) {
  if (!node) return null;
  name = name.toLowerCase();
  for (const key in node) {
    if (key.toLowerCase() === name) return node[key];
    if (typeof node[key] === 'object' && !node[key].lba) { const found = findFileByName(node[key], name); if (found) return found; }
  }
  return null;
}

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); if (e.dataTransfer.files[0]) handleISO(e.dataTransfer.files[0]); });
document.getElementById('iso-input').addEventListener('change', e => { if (e.target.files[0]) handleISO(e.target.files[0]); });

async function handleISO(file) {
  state.isoName = file.name; isoFileObj = file;
  document.getElementById('drop-title').textContent = "Mounting ISO...";
  document.getElementById('drop-text').textContent = "Please wait while the filesystem is parsed.";
  toast('Parsing ISO...');
  try {
    const isoInfo = await parseIso9660(file);
    if (isoInfo) {
      const isoRootNode = await buildIsoTree(file, isoInfo.rootLba, isoInfo.rootSize);
      const setupNode = findFileByName(isoRootNode, 'setup.exe') || findFileByName(isoRootNode, 'setup64.exe');
      if (setupNode) {
        state.setupSize = setupNode.size;
        document.getElementById('drop-title').textContent = "ISO Mounted Successfully";
        document.getElementById('drop-text').textContent = `Found setup.exe (${(state.setupSize/1048576).toFixed(2)} MB). Ready to boot.`;
      } else {
        document.getElementById('drop-title').textContent = "ISO Mounted";
        document.getElementById('drop-text').textContent = "No setup.exe found, but ready to boot.";
      }
    } else {
      document.getElementById('drop-title').textContent = "Invalid ISO Format";
      document.getElementById('drop-text').textContent = "Booting default VHD instead.";
    }
  } catch (e) {
    document.getElementById('drop-title').textContent = "Parsing Error";
    document.getElementById('drop-text').textContent = "Booting default VHD instead.";
  }
}

// --- Boot Sequence ---
async function startBootSequence() {
  switchView('boot-view'); HostSystem.init();
  const bios = document.getElementById('bios-text');
  const stageBios = document.getElementById('stage-bios');
  stageBios.classList.add('active'); bios.innerHTML = '';
  const biosLines = [`WebVM BIOS v11.0`, `ISO Mounted: ${state.isoName}`, ``, `CPU: ${HostSystem.cores} Cores`, `Memory: ${HostSystem.ram}`, ``, `<span style="color:var(--success)">Booting from VHD...</span>`, `Loading boot sector...`];
  for (const line of biosLines) { bios.innerHTML += line + '<br>'; await new Promise(r => setTimeout(r, 150)); }
  await new Promise(r => setTimeout(r, 800));
  stageBios.classList.remove('active');
  
  const stageWinboot = document.getElementById('stage-winboot');
  stageWinboot.classList.add('active');
  await new Promise(r => setTimeout(r, 2500));
  stageWinboot.classList.remove('active');
  
  const stageSetup = document.getElementById('stage-setup');
  stageSetup.classList.add('active');
  await runSetup();
  stageSetup.classList.remove('active');
  
  await runNamePrompt();
  playStartupChime();
  buildDesktop();
  document.getElementById('desktop-container').style.opacity = '1';
  document.getElementById('desktop-container').style.pointerEvents = 'all';
  resetScreensaverTimer();
}

async function runSetup() {
  const setupSteps = document.getElementById('setup-steps');
  const setupFill = document.getElementById('setup-fill');
  const sizeStr = state.setupSize > 0 ? `(${(state.setupSize/1048576).toFixed(2)} MB)` : '';
  const steps = [
    { text: `Executing D:\\setup.exe ${sizeStr}...`, pct: 10 },
    { text: 'Starting Windows Installation...', pct: 20 },
    { text: 'Copying installation files to C:\\$Windows.~BT...', pct: 40 },
    { text: 'Extracting files from install.wim...', pct: 60 },
    { text: 'Installing features and drivers...', pct: 80 },
    { text: 'Finalizing settings and registry...', pct: 100 }
  ];
  for (let i=0; i<steps.length; i++) {
    const div = document.createElement('div');
    div.className = 'setup-step';
    div.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4cc2ff" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg> ${steps[i].text}`;
    setupSteps.appendChild(div);
    setupFill.style.width = steps[i].pct + '%';
    await new Promise(r => setTimeout(r, 800));
    div.querySelector('svg').innerHTML = '<polyline points="20 6 9 17 4 12" stroke="#34e89e" stroke-width="3"/>';
  }
  await new Promise(r => setTimeout(r, 600));
}

// --- Name prompt (boot) ---
let bootNameResolve = null;
function runNamePrompt() {
  return new Promise((resolve) => {
    bootNameResolve = resolve;
    const stage = document.getElementById('stage-name');
    stage.classList.add('active');
    const saved = localStorage.getItem('webvm_username');
    const input = document.getElementById('boot-name-input');
    input.value = saved || '';
    setTimeout(() => input.focus(), 50);
  });
}
function submitBootName() {
  const input = document.getElementById('boot-name-input');
  const name = (input.value || '').trim() || 'Admin';
  state.userName = name;
  localStorage.setItem('webvm_username', name);
  document.getElementById('stage-name').classList.remove('active');
  if (bootNameResolve) { bootNameResolve(); bootNameResolve = null; }
}

// --- Startup chime ---
function playStartupChime() {
  const enabled = localStorage.getItem('webvm_chime_enabled');
  if (enabled === 'off') return;
  if (isMuted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      const start = audioCtx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.15, start + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, start + 1.1);
      o.connect(g).connect(audioCtx.destination);
      o.start(start); o.stop(start + 1.2);
    });
  } catch (e) {}
}

// --- Discord webhook integration ---
// The webhook URL comes only from a sibling config.js loaded above, which sets
// window.WEBVM_DISCORD_WEBHOOK. Never commit a real webhook URL directly into
// this HTML file — keep it in config.js, and keep config.js out of version
// control (.gitignore) unless the repo is private.
function getDiscordWebhook() {
  return (typeof window.WEBVM_DISCORD_WEBHOOK === 'string' && window.WEBVM_DISCORD_WEBHOOK.trim())
    ? window.WEBVM_DISCORD_WEBHOOK.trim()
    : '';
}
function getDiscordLog() { try { return JSON.parse(localStorage.getItem('webvm_discord_log') || '[]'); } catch (e) { return []; } }
function saveDiscordLog(log) { if (log.length > 200) log = log.slice(-200); localStorage.setItem('webvm_discord_log', JSON.stringify(log)); }
function pushDiscordLog(entry) {
  const log = getDiscordLog();
  log.push(entry);
  saveDiscordLog(log);
  renderDiscordLog();
  return entry.id;
}
function updateDiscordLogStatus(id, status) {
  const log = getDiscordLog();
  const entry = log.find(m => m.id === id);
  if (!entry) return;
  entry.status = status;
  saveDiscordLog(log);
  renderDiscordLog();
}
function renderDiscordLog() {
  const el = document.getElementById('discord-log');
  if (!el) return;
  const log = getDiscordLog();
  el.innerHTML = log.map(m => {
    let statusLine = '';
    if (m.status === 'sending') statusLine = '<div style="color:#888; font-size:11px;">sending…</div>';
    else if (m.status === 'failed') statusLine = `<div style="color:var(--danger); font-size:11px;">⚠ failed to send — no webhook configured (set WEBVM_DISCORD_WEBHOOK in config.js)</div>`;
    return `<div style="margin-bottom:10px;"><span style="color:var(--accent-light); font-weight:600;">${escapeHtml(m.user)}</span> <span style="color:#666; font-size:11px;">${escapeHtml(m.time)}</span><div style="color:#dcddde;">${escapeHtml(m.text)}</div>${statusLine}</div>`;
  }).join('') || '<p style="color:#888;">No messages yet. Try: msg hello from the terminal.</p>';
  el.scrollTop = el.scrollHeight;
}
async function sendDiscordMessage(text) {
  const webhook = getDiscordWebhook();
  const user = state.userName || 'Admin';
  const time = new Date().toLocaleTimeString();
  const id = 'm' + Date.now() + Math.random().toString(36).slice(2, 7);
  pushDiscordLog({ id, user, time, text, status: webhook ? 'sending' : 'failed' });
  if (!webhook) return { ok: false, reason: 'no-webhook' };
  try {
    const res = await fetch(webhook, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text, username: `${user} (WebVM)` })
    });
    updateDiscordLogStatus(id, res.ok ? 'sent' : 'failed');
    return { ok: res.ok };
  } catch (e) {
    updateDiscordLogStatus(id, 'failed');
    return { ok: false, reason: 'network' };
  }
}

// --- Desktop icon click-select + rubber-band multi-select ---
function setupDesktopIconSelection() {
  const iconsContainer = document.querySelector('.desktop-icons');
  if (!iconsContainer) return;
  iconsContainer.querySelectorAll('.desktop-icon').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!e.ctrlKey) iconsContainer.querySelectorAll('.desktop-icon.selected').forEach(o => o.classList.remove('selected'));
      el.classList.toggle('selected');
    });
  });
  const desktop = document.getElementById('desktop-container');
  let selecting = false, startX = 0, startY = 0, boxEl = null;
  desktop.addEventListener('mousedown', (e) => {
    if (e.target !== desktop && e.target !== iconsContainer) return;
    selecting = true; startX = e.clientX; startY = e.clientY;
    iconsContainer.querySelectorAll('.desktop-icon.selected').forEach(o => o.classList.remove('selected'));
    boxEl = document.createElement('div'); boxEl.className = 'select-box';
    boxEl.style.left = startX + 'px'; boxEl.style.top = startY + 'px';
    document.body.appendChild(boxEl);
  });
  document.addEventListener('mousemove', (e) => {
    if (!selecting || !boxEl) return;
    const x = Math.min(startX, e.clientX), y = Math.min(startY, e.clientY);
    const w = Math.abs(e.clientX - startX), h = Math.abs(e.clientY - startY);
    boxEl.style.left = x + 'px'; boxEl.style.top = y + 'px'; boxEl.style.width = w + 'px'; boxEl.style.height = h + 'px';
    const box = boxEl.getBoundingClientRect();
    iconsContainer.querySelectorAll('.desktop-icon').forEach(icon => {
      const r = icon.getBoundingClientRect();
      const overlaps = !(r.right < box.left || r.left > box.right || r.bottom < box.top || r.top > box.bottom);
      icon.classList.toggle('selected', overlaps);
    });
  });
  document.addEventListener('mouseup', () => { selecting = false; if (boxEl) { boxEl.remove(); boxEl = null; } });
}

function toggleStartMenu() { document.getElementById('start-menu').classList.toggle('visible'); hideFlyouts(); }
function toggleFlyout(id) { const f = document.getElementById('flyout-'+id); const isVisible = f.classList.contains('visible'); hideFlyouts(); document.getElementById('start-menu').classList.remove('visible'); if (!isVisible) f.classList.add('visible'); }

// --- Mute ---
let isMuted = false;
function toggleMute() {
  isMuted = !isMuted;
  const icon = document.getElementById('tray-mute-icon');
  if (icon) icon.textContent = isMuted ? '🔇' : '🔊';
  document.querySelectorAll('video, audio').forEach(el => el.muted = isMuted);
  toast(isMuted ? 'Muted' : 'Unmuted');
}

// --- Show Desktop ---
let showDesktopState = { active: false, restore: {} };
function toggleShowDesktop() {
  showDesktopState.active = !showDesktopState.active;
  if (showDesktopState.active) {
    showDesktopState.restore = {};
    Object.keys(openWindows).forEach(id => { showDesktopState.restore[id] = openWindows[id].minimized; if (!openWindows[id].minimized) minimizeWindow(id); });
  } else {
    Object.keys(openWindows).forEach(id => { if (!showDesktopState.restore[id]) minimizeWindow(id); });
  }
}

// --- Security Screen (Ctrl+Alt+Del) ---
function showSecurityScreen() {
  document.getElementById('start-menu').classList.remove('visible'); hideFlyouts();
  const el = document.getElementById('security-screen'); if (el) el.classList.add('visible');
}
function hideSecurityScreen() { const el = document.getElementById('security-screen'); if (el) el.classList.remove('visible'); }
function filterStartMenu(val) {
  const tilesEl = document.getElementById('start-tiles');
  const resultsEl = document.getElementById('start-file-results');
  document.querySelectorAll('.start-tile').forEach(t => { t.style.display = t.textContent.toLowerCase().includes(val.toLowerCase()) ? 'flex' : 'none'; });
  if (!val.trim()) { resultsEl.style.display = 'none'; resultsEl.innerHTML = ''; tilesEl.style.display = 'grid'; return; }
  const matches = searchVfs(val.trim());
  if (matches.length === 0) { resultsEl.style.display = 'none'; return; }
  resultsEl.style.display = 'flex';
  resultsEl.innerHTML = `<div style="font-size:11px; color:#888; padding:6px 4px 2px;">Files</div>` + matches.map((m, i) => {
    const ic = iconForKind(m.isDir ? 'dir' : detectKind(m.name, ''), m.isDir);
    return `<div class="es-item" data-idx="${i}" style="display:flex; align-items:center; gap:10px; padding:6px 8px;"><svg viewBox="0 0 24 24" fill="${ic.fill}" style="width:20px;height:20px;flex-shrink:0;"><path d="${ic.path}"/></svg><span style="font-size:13px;">${escapeHtml(m.name)}</span><span style="font-size:11px; color:#888; margin-left:auto;">${escapeHtml(m.path.slice(0, -1).join('\\'))}</span></div>`;
  }).join('');
  resultsEl.querySelectorAll('[data-idx]').forEach(el => el.onclick = () => openSearchResult(matches[el.dataset.idx].path, matches[el.dataset.idx].isDir));
}
function searchVfs(term) {
  term = term.toLowerCase(); const results = [];
  (function walk(node, path) {
    for (const key in node) {
      const full = path.concat(key);
      if (typeof node[key] === 'string') { if (key.toLowerCase().includes(term)) results.push({ name: key, path: full }); }
      else { if (key.toLowerCase().includes(term)) results.push({ name: key, path: full, isDir: true }); walk(node[key], full); }
    }
  })(VFS.fs, []);
  return results.slice(0, 8);
}
function openSearchResult(pathArr, isDir) {
  document.getElementById('start-menu').classList.remove('visible');
  if (isDir) { openApp('explorer'); setTimeout(() => explorerNav(pathArr.join('\\')), 60); }
  else { VFS.path = pathArr.slice(0, -1); openVFSFile(pathArr[pathArr.length - 1]); }
}

// --- Lock Screen ---
let lockClockTimer = null;
function showLockScreen() {
  document.getElementById('start-menu').classList.remove('visible'); hideFlyouts();
  const el = document.getElementById('lock-screen');
  el.classList.remove('hidden-lock');
  const update = () => {
    const d = new Date();
    document.getElementById('lock-clock').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.getElementById('lock-date').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  };
  update(); lockClockTimer = setInterval(update, 1000);
}
function unlockScreen() {
  document.getElementById('lock-screen').classList.add('hidden-lock');
  clearInterval(lockClockTimer);
}

// --- Alt+Tab Window Switcher ---
let altTabIdx = 0, altTabActive = false;
function updateAltTabList() {
  const ids = Object.keys(openWindows);
  const list = document.getElementById('alttab-list');
  if (ids.length === 0) { document.getElementById('alttab-overlay').classList.remove('visible'); altTabActive = false; return; }
  altTabIdx = ((altTabIdx % ids.length) + ids.length) % ids.length;
  list.innerHTML = ids.map((id, i) => `<div class="alttab-item ${i === altTabIdx ? 'selected' : ''}">${getApps().find(a => a.id === id)?.icon || ''}<span>${escapeHtml(openWindows[id].title)}</span></div>`).join('');
}

document.addEventListener('click', (e) => {
  const menu = document.getElementById('start-menu'); const btn = document.querySelector('.start-btn');
  if (menu && !menu.contains(e.target) && (!btn || !btn.contains(e.target))) menu.classList.remove('visible');
  const ctx = document.getElementById('context-menu');
  if (ctx && !ctx.contains(e.target)) ctx.classList.remove('visible');
  if (!e.target.closest('.flyout') && !e.target.closest('.taskbar-tray') && !e.target.closest('.taskbar-widgets')) hideFlyouts();
});
document.addEventListener('keydown', (e) => {
  const lockEl = document.getElementById('lock-screen');
  if (lockEl && !lockEl.classList.contains('hidden-lock')) { unlockScreen(); return; }
  if (e.key === 'Escape') { document.getElementById('start-menu').classList.remove('visible'); hideFlyouts(); document.getElementById('context-menu').classList.remove('visible'); hideSecurityScreen(); }
  if (e.altKey && e.key === 'Tab') {
    e.preventDefault();
    const ids = Object.keys(openWindows);
    if (ids.length === 0) return;
    if (!altTabActive) { altTabActive = true; altTabIdx = 0; document.getElementById('alttab-overlay').classList.add('visible'); }
    else { altTabIdx += (e.shiftKey ? -1 : 1); }
    updateAltTabList();
  }
  if (e.altKey && e.key === 'F4') { e.preventDefault(); const id = getFocusedWindowId(); if (id) closeWindow(id); }
  if (e.ctrlKey && e.shiftKey && e.key === 'Escape') { e.preventDefault(); openApp('taskmgr'); }
  if (e.ctrlKey && e.altKey && !e.shiftKey) {
    if (e.key.toLowerCase() === 't') { e.preventDefault(); openApp('terminal'); }
    else if (e.key.toLowerCase() === 'e') { e.preventDefault(); openApp('explorer'); }
    else if (e.key.toLowerCase() === 'l') { e.preventDefault(); showLockScreen(); }
  }
});
function getFocusedWindowId() {
  let best = null, bestZ = -1;
  Object.keys(openWindows).forEach(id => {
    const w = openWindows[id];
    if (w.minimized) return;
    const z = parseInt(w.element.style.zIndex) || 0;
    if (z > bestZ) { bestZ = z; best = id; }
  });
  return best;
}
document.addEventListener('keyup', (e) => {
  if (e.key === 'Alt' && altTabActive) {
    altTabActive = false;
    document.getElementById('alttab-overlay').classList.remove('visible');
    const ids = Object.keys(openWindows);
    if (ids.length > 0) { const target = ids[((altTabIdx % ids.length) + ids.length) % ids.length]; if (openWindows[target].minimized) minimizeWindow(target); focusWindow(target); }
  }
});

function showContextMenu(x, y, items) {
  const menu = document.getElementById('context-menu');
  menu.innerHTML = items.map((item, i) => `<div class="ctx-item" data-idx="${i}">${item.label}</div>`).join('');
  menu.querySelectorAll('.ctx-item').forEach((el) => {
    el.onclick = () => { items[el.dataset.idx].action(); menu.classList.remove('visible'); };
  });
  const menuW = 190, menuH = items.length * 34 + 12;
  const px = Math.min(x, window.innerWidth - menuW - 10);
  const py = Math.min(y, window.innerHeight - menuH - 10);
  menu.style.left = px + 'px'; menu.style.top = py + 'px';
  menu.classList.add('visible');
}

// --- Window resizing ---
let resizeState = null;
function initResize(e, appId, dir) {
  e.stopPropagation(); e.preventDefault();
  const w = openWindows[appId]; if (!w || w.maximized) return;
  const el = w.element;
  resizeState = { appId, dir, startX: e.clientX, startY: e.clientY, startW: el.offsetWidth, startH: el.offsetHeight, startLeft: el.offsetLeft, startTop: el.offsetTop };
  document.addEventListener('mousemove', doResize); document.addEventListener('mouseup', stopResize);
}
function doResize(e) {
  if (!resizeState) return;
  const { appId, dir, startX, startY, startW, startH, startLeft, startTop } = resizeState;
  const el = openWindows[appId].element;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  const minW = 300, minH = 200;
  if (dir.includes('e')) el.style.width = Math.max(minW, startW + dx) + 'px';
  if (dir.includes('s')) el.style.height = Math.max(minH, startH + dy) + 'px';
  if (dir.includes('w')) { const newW = Math.max(minW, startW - dx); el.style.width = newW + 'px'; el.style.left = (startLeft + startW - newW) + 'px'; }
  if (dir.includes('n')) { const newH = Math.max(minH, startH - dy); el.style.height = newH + 'px'; el.style.top = (startTop + startH - newH) + 'px'; }
}
function stopResize() { resizeState = null; document.removeEventListener('mousemove', doResize); document.removeEventListener('mouseup', stopResize); }

      <div class="snap-option" onclick="snapWindow('${appId}', 'right-half')"><div></div><div class="active"></div><div></div><div></div></div>
      <div class="snap-option" onclick="snapWindow('${appId}', 'top-left')"><div class="active"></div><div></div><div></div><div></div></div>
      <div class="snap-option" onclick="snapWindow('${appId}', 'top-right')"><div></div><div class="active"></div><div></div><div></div></div>
      <div class="snap-option" onclick="snapWindow('${appId}', 'bottom-left')"><div></div><div></div><div class="active"></div><div></div></div>

    `;

  win.querySelector('.snap-layout').classList.add('visible');

function hideSnapLayout() { document.querySelectorAll('.snap-layout').forEach(l => l.classList.remove('visible')); }
function snapWindow(appId, pos) {
  const w = openWindows[appId].element;
  w.style.top = '0px'; w.style.transition = 'all 0.2s'; w.style.borderRadius = '0'; w.style.height = 'calc(100% - 60px)';
  if (pos === 'left-half') { w.style.left = '0px'; w.style.width = '50%'; }
  else if (pos === 'right-half') { w.style.left = '50%'; w.style.width = '50%'; }
  else if (pos === 'top-left') { w.style.left = '0px'; w.style.width = '50%'; w.style.height = '50%'; }
  else if (pos === 'top-right') { w.style.left = '50%'; w.style.width = '50%'; w.style.height = '50%'; }
  else if (pos === 'bottom-left') { w.style.left = '0px'; w.style.width = '50%'; w.style.top = '50%'; w.style.height = '50%'; }
  else if (pos === 'bottom-right') { w.style.left = '50%'; w.style.width = '50%'; w.style.top = '50%'; w.style.height = '50%'; }
  setTimeout(() => w.style.transition = 'opacity 0.2s, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)', 200);
  hideSnapLayout();
}

// --- App Logic: Brave Browser (multi-tab) ---
const BRAVE_HOME_TILES = [
  { label: 'Wikipedia', fav: '📖', url: 'https://www.wikipedia.org' },
  { label: 'DuckDuckGo', fav: '🦆', url: 'https://duckduckgo.com' },
  { label: 'MDN Web Docs', fav: '📗', url: 'https://developer.mozilla.org' },
  { label: 'Internet Archive', fav: '🏛️', url: 'https://archive.org' }
];
let braveState = { tabs: [], activeTab: 0 };
function getBraveContent() {
  return `<div class="brave-tabs" id="brave-tabs"></div>
    <div class="brave-toolbar">
      <button class="brave-btn" onclick="braveNav('back')" title="Back">←</button>
      <button class="brave-btn" onclick="braveNav('forward')" title="Forward">→</button>
      <button class="brave-btn" onclick="braveNav('reload')" title="Reload">⟳</button>
      <button class="brave-btn" onclick="braveNav('home')" title="Home">⌂</button>
      <input type="text" class="brave-input" id="brave-input" placeholder="Search or type a URL" onkeydown="if(event.key==='Enter')navigateBrave(this.value)">
      <button class="brave-btn" onclick="navigateBrave(document.getElementById('brave-input').value)">Go</button>
    </div>
    <div id="brave-frame-container" style="flex:1; display:flex; overflow:hidden;"></div>`;
}
function currentTab() { return braveState.tabs[braveState.activeTab]; }
function renderBraveTabs() {
  const tabsEl = document.getElementById('brave-tabs');
  if (!tabsEl) return;
  tabsEl.innerHTML = braveState.tabs.map((t, i) => `<div class="brave-tab ${i === braveState.activeTab ? 'active' : ''}" data-idx="${i}">🌐 <span class="tab-title">${escapeHtml(t.title || 'New Tab')}</span><span class="tab-close" data-close="${i}">✕</span></div>`).join('') + `<div class="brave-newtab-btn" id="brave-newtab">＋</div>`;
  tabsEl.querySelectorAll('.brave-tab').forEach(el => el.addEventListener('click', (e) => { if (e.target.dataset.close !== undefined) return; braveSwitchTab(parseInt(el.dataset.idx)); }));
  tabsEl.querySelectorAll('.tab-close').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); braveCloseTab(parseInt(el.dataset.close)); }));
  const nt = document.getElementById('brave-newtab'); if (nt) nt.onclick = braveNewTab;
  renderBraveFrame();
}
function renderBraveFrame() {
  const container = document.getElementById('brave-frame-container');
  const input = document.getElementById('brave-input');
  const tab = currentTab();
  if (!tab) return;
  if (input) input.value = tab.url || '';
  if (!tab.url) {
    container.innerHTML = `<div class="brave-home">
      <img src="data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><circle cx="30" cy="30" r="28" fill="#FB542B"/></svg>')}" style="width:56px;margin-bottom:20px;">
      <input type="text" placeholder="Search or type a URL" onkeydown="if(event.key==='Enter')navigateBrave(this.value)">
      <div class="brave-home-tiles">${BRAVE_HOME_TILES.map(t => `<div class="brave-home-tile" data-url="${escapeHtml(t.url)}"><div class="fav">${t.fav}</div>${t.label}</div>`).join('')}</div>
    </div>`;
    container.querySelectorAll('.brave-home-tile').forEach(el => el.onclick = () => navigateBrave(el.dataset.url));
  } else {
    const safeUrl = escapeHtml(tab.url);
    container.innerHTML = `<div class="brave-frame-wrap">
        <div class="brave-spinner-overlay" id="brave-spinner"><div class="spin"></div><span>Loading ${escapeHtml(tab.title || tab.url)}…</span></div>
        <iframe class="brave-iframe" id="brave-frame" src="${safeUrl}"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals"
          allow="clipboard-write; encrypted-media; picture-in-picture; fullscreen"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div class="brave-embed-hint">Page not loading? Many sites block embedding. <a href="${safeUrl}" target="_blank" rel="noopener">Open in a real tab ↗</a></div>
      </div>`;
    const frame = document.getElementById('brave-frame');
    const spinner = document.getElementById('brave-spinner');
    let done = false;
    frame.addEventListener('load', () => { done = true; if (spinner) spinner.style.opacity = '0'; setTimeout(() => spinner && spinner.remove(), 200); });
    setTimeout(() => { if (!done && spinner) { spinner.style.opacity = '0'; setTimeout(() => spinner.remove(), 200); } }, 6000);
  }
}
function braveNewTab() {
  braveState.tabs.push({ id: 't'+Date.now(), url: null, history: [], histIdx: -1, title: 'New Tab' });
  braveState.activeTab = braveState.tabs.length - 1;
  renderBraveTabs();
}
function braveCloseTab(i) {
  braveState.tabs.splice(i, 1);
  if (braveState.tabs.length === 0) { closeWindow('brave'); return; }
  if (braveState.activeTab >= braveState.tabs.length) braveState.activeTab = braveState.tabs.length - 1;
  else if (i < braveState.activeTab) braveState.activeTab--;
  renderBraveTabs();
}
function braveSwitchTab(i) { braveState.activeTab = i; renderBraveTabs(); }
function navigateBrave(url) {
  if (!url) return;
  let finalUrl = url;
  if (!url.match(/^https?:\/\//)) {
    if (url.includes('.') && !url.includes(' ')) finalUrl = 'https://' + url;
    else finalUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
  }
  const tab = currentTab(); if (!tab) return;
  tab.history = tab.history.slice(0, tab.histIdx + 1);
  tab.history.push(finalUrl); tab.histIdx = tab.history.length - 1;
  tab.url = finalUrl;
  try { tab.title = new URL(finalUrl).hostname; } catch (e) { tab.title = finalUrl; }
  renderBraveTabs();
}
function braveNav(action) {
  const tab = currentTab(); if (!tab) return;
  if (action === 'back' && tab.histIdx > 0) { tab.histIdx--; tab.url = tab.history[tab.histIdx]; }
  else if (action === 'forward' && tab.histIdx < tab.history.length - 1) { tab.histIdx++; tab.url = tab.history[tab.histIdx]; }
  else if (action === 'reload') {
    const frame = document.getElementById('brave-frame');
    if (frame) { const u = frame.src; frame.src = 'about:blank'; requestAnimationFrame(() => frame.src = u); return; }
  }
  else if (action === 'home') { tab.url = null; }
  renderBraveTabs();
}

// --- Screensaver (idle detection + bouncing logo) ---
let screensaverIdleTimer = null, screensaverEl = null;
const SCREENSAVER_IDLE_MS = 90000;
function resetScreensaverTimer() {
  clearTimeout(screensaverIdleTimer);
  if (screensaverEl) dismissScreensaver();
  screensaverIdleTimer = setTimeout(showScreensaver, SCREENSAVER_IDLE_MS);
}
function showScreensaver() {
  if (screensaverEl) return;
  const lockVisible = document.getElementById('lock-screen') && !document.getElementById('lock-screen').classList.contains('hidden-lock');
  if (lockVisible) return;
  const canvas = document.createElement('canvas');
  canvas.id = 'screensaver-canvas';
  canvas.style.cssText = 'position:fixed; inset:0; z-index:90000; background:#000; cursor:pointer;';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  screensaverEl = canvas;
  const ctx = canvas.getContext('2d');
  let x = 100, y = 100, dx = 2.4, dy = 2.1;
  const text = 'WebVM 11'; ctx.font = '28px sans-serif';
  const w = ctx.measureText(text).width + 20, h = 40;
  let raf;
  function frame() {
    if (!screensaverEl) return;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    x += dx; y += dy;
    if (x <= 0 || x + w >= canvas.width) dx *= -1;
    if (y <= 0 || y + h >= canvas.height) dy *= -1;
    ctx.fillStyle = `hsl(${(Date.now()/20)%360}, 80%, 60%)`;
    ctx.font = '28px sans-serif'; ctx.fillText(text, x, y + 28);
    raf = requestAnimationFrame(frame);
  }
  frame();
  canvas._raf = () => cancelAnimationFrame(raf);
  canvas.addEventListener('mousedown', dismissScreensaver);
  canvas.addEventListener('touchstart', dismissScreensaver);
}
function dismissScreensaver() {
  if (!screensaverEl) return;
  if (screensaverEl._raf) screensaverEl._raf();
  screensaverEl.remove();
  screensaverEl = null;
}
['mousemove','mousedown','keydown','touchstart'].forEach(evt => document.addEventListener(evt, () => {
  if (localStorage.getItem('webvm_screensaver_enabled') === 'off') { clearTimeout(screensaverIdleTimer); return; }
  resetScreensaverTimer();
}, { passive: true }));

const EXT_KIND = {
  bat: 'bat', cmd: 'bat',
  exe: 'exe', msi: 'exe',
  mp3: 'audio', wav: 'audio', ogg: 'audio', flac: 'audio', m4a: 'audio',
  mp4: 'video', webm: 'video', mov: 'video', avi: 'video', mkv: 'video',
  png: 'image', jpg: 'image', jpeg: 'image', gif: 'image', webp: 'image', bmp: 'image', svg: 'image',
  pdf: 'pdf',
  zip: 'archive', rar: 'archive', '7z': 'archive', tar: 'archive', gz: 'archive',
  js: 'code', json: 'code', css: 'code', html: 'code', htm: 'code', py: 'code', c: 'code', cpp: 'code', java: 'code', ts: 'code', sh: 'code', xml: 'code', yml: 'code', yaml: 'code',

  if (kind === 'audio') return { fill: '#a78bfa', path: 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z' };
  if (kind === 'pdf') return { fill: '#ff4d6d', path: 'M6 2h9l5 5v15H6zM14 2v5h5' };

  return { fill: '#fff', path: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z' };

function uniqueVfsName(node, base) {

  const stem = hasExt ? base.slice(0, dot) : base;
  const ext = hasExt ? base.slice(dot) : '';

}
function explorerPaste() {
  if (!vfsClipboard) return;

  if (!node) return;
  const destPath = VFS.path.join('\\');
  if (vfsClipboard.cut && destPath === vfsClipboard.from) { toast('Already here.'); return; }
  let targetName = vfsClipboard.cut ? vfsClipboard.name : uniqueVfsName(node, vfsClipboard.name);
  if (vfsClipboard.cut && node[targetName] !== undefined) targetName = uniqueVfsName(node, targetName);

function explorerNav(path) {
  VFS.path = VFS.resolve(path);
  const main = document.getElementById('explorer-main');
  const pathInput = document.getElementById('explorer-path-input');
  if (pathInput) pathInput.value = VFS.path.join('\\');

  main.oncontextmenu = (e) => {

      { label: 'New File', action: () => explorerNewFile() },
      { label: 'New Folder', action: () => { const n = prompt('Folder name:', 'New Folder'); if (n) { VFS.mkdir(VFS.path.join('\\') + '\\' + n); explorerNav(VFS.path.join('\\')); } } },
      { label: 'New Batch File', action: () => explorerNewBatchFile() },

        items.push({ label: 'Edit in Notepad', action: () => openApp('notepad', { path: VFS.path.join('\\') + '\\' + name, content: VFS.read(VFS.path.join('\\') + '\\' + name) || '' }) });

        { label: 'Rename', action: () => { const nn = prompt('Rename to:', name); if (nn) { VFS.rename(VFS.path.join('\\') + '\\' + name, nn); explorerNav(VFS.path.join('\\')); } } },

// --- Batch (.bat) file execution ---
function expandBatchVars(line, params) {
  line = line.replace(/%(\d)/g, (m, n) => (params && params[n - 1] !== undefined) ? params[n - 1] : '');
  line = line.replace(/%~?([A-Za-z_][A-Za-z0-9_]*)%/g, (m, v) => envVars[v] !== undefined ? envVars[v] : m);
  line = line.replace(/\$\{([A-Za-z_][A-Za-z0-9_]*)\}/g, (m, v) => envVars[v] !== undefined ? envVars[v] : m);
  line = line.replace(/\$([A-Za-z_][A-Za-z0-9_]*)/g, (m, v) => envVars[v] !== undefined ? envVars[v] : m);
  return line;
}
function globToRegex(pattern) {

    if (isRoot) addLine(`<span style="color:var(--accent-light)">Running ${escapeHtml(fullPath)}...</span>`);
    const rawLines = (content || '').split('\n').map(l => l.replace(/\r$/, ''));
    let echoOn = true;
    const labels = {};
    rawLines.forEach((l, i) => { const m = /^:([A-Za-z_][\w-]*)\s*$/.exec(l.trim()); if (m) labels[m[1].toLowerCase()] = i; });

      let line = rawLines[i].trim(); i++;
      if (!line) continue;
      if (/^:/.test(line)) continue; // label definition, no-op
      if (line.startsWith('::') || /^rem(\s|$)/i.test(line)) continue;
      let silent = false;
      if (line.startsWith('@')) { silent = true; line = line.slice(1).trim(); }
      if (/^echo\s+off$/i.test(line)) { echoOn = false; continue; }
      if (/^echo\s+on$/i.test(line)) { echoOn = true; continue; }
      line = expandBatchVars(line, params);
      if (!silent && echoOn) addLine(`<span style="color:var(--success)">${escapeHtml(VFS.path.join('\\'))}&gt;</span> ${escapeHtml(line)}`);

      // GOTO

      m = /^timeout\s+(?:\/t\s+)?(\d+)/i.exec(line) || /^ping\s+.*-n\s+(\d+)/i.exec(line);
      if (m) { const secs = Math.min(parseInt(m[1], 10) || 1, 10); addLine(`Waiting ${secs}s...`); await sleep(secs * 1000); continue; }

      m = /^call\s+(\S+)(.*)$/i.exec(line);
      if (m) {
        const callArgs = m[2].trim().split(/\s+/).filter(Boolean);
        const callContent = VFS.read(VFS.path.join('\\') + '\\' + m[1]);
        if (callContent === null) addLine(`The system cannot find the file specified: ${escapeHtml(m[1])}`);
        else await runBatchFile(m[1], callContent, callArgs, depth + 1);
        continue;
      }
      // IF EXIST / IF NOT EXIST / IF DEFINED / IF "a"=="b"
      m = /^if\s+(not\s+)?exist\s+(\S+)\s+(.*)$/i.exec(line);
      if (m) { const exists = VFS.exists(VFS.path.join('\\') + '\\' + m[2]); const negate = !!m[1]; if (exists !== negate) rawLines.splice(i, 0, m[3]); continue; }
      m = /^if\s+(not\s+)?defined\s+([A-Za-z_][\w]*)\s+(.*)$/i.exec(line);
      if (m) { const def = envVars[m[2]] !== undefined; const negate = !!m[1]; if (def !== negate) rawLines.splice(i, 0, m[3]); continue; }
      m = /^if\s+(not\s+)?"?([^"=]*)"?\s*==\s*"?([^"]*)"?\s+(.*)$/i.exec(line);
      if (m) { const eq = m[2] === m[3]; const negate = !!m[1]; if (eq !== negate) rawLines.splice(i, 0, m[4]); continue; }
      // FOR %%v IN (a b c) DO command
      m = /^for\s+%%?([A-Za-z])\s+in\s+\(([^)]*)\)\s+do\s+(.*)$/i.exec(line);
      if (m) {
        const varName = m[1]; const items = m[2].trim().split(/[\s,]+/).filter(Boolean);
        for (const item of items) { const sub = m[3].replace(new RegExp('%%?' + varName, 'g'), item); processCommand(sub); }
        continue;
      }
      // command chaining: && (run next regardless, no real error state) and ; (Linux-style)
      const segments = line.split(/\s*&&\s*|\s*;\s*/).filter(Boolean);
      for (const seg of segments) processCommand(seg);
    }
    if (isRoot) addLine(`<span style="color:var(--accent-light)">Batch file finished.</span>`);
  };
  if (isRoot) { await sleep(200); await doRun(); } else { await doRun(); }
}

const TEXT_LIKE_KINDS = ['text', 'code', 'bat'];
function uploadToVFS(files) {
  if (!files || files.length === 0) return;
  for (let file of files) {
    const ext = extOf(file.name);
    const isTextLike = TEXT_LIKE_KINDS.includes(EXT_KIND[ext]) || file.type.startsWith('text/') || (!file.type && !EXT_KIND[ext]);
    const reader = new FileReader();
    reader.onload = (e) => {
      VFS.write(VFS.path.join('\\') + '\\' + file.name, e.target.result);
      explorerNav(VFS.path.join('\\'));
      toast(`${file.name} uploaded to VFS.`);
    };
    if (isTextLike) reader.readAsText(file); else reader.readAsDataURL(file);
  }
}

function fmtMMSS(totalSec) { const m = Math.floor(totalSec/60), s = Math.floor(totalSec%60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }

// --- App Logic: Minesweeper ---
let mineState = null;
function initMinesweeper() {
  const rows = 9, cols = 9, mines = 10;
  const grid = [];
  for (let r = 0; r < rows; r++) { grid.push(new Array(cols).fill(0).map(() => ({ mine: false, revealed: false, flagged: false, adj: 0 }))); }
  let placed = 0;
  while (placed < mines) {
    const r = Math.floor(Math.random()*rows), c = Math.floor(Math.random()*cols);
    if (!grid[r][c].mine) { grid[r][c].mine = true; placed++; }
  }
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (grid[r][c].mine) continue;
    let count = 0;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const rr = r+dr, cc = c+dc;
      if (rr>=0 && rr<rows && cc>=0 && cc<cols && grid[rr][cc].mine) count++;
    }
    grid[r][c].adj = count;
  }
  mineState = { grid, rows, cols, mines, over: false, flagsUsed: 0 };
  renderMinesweeper();
  const status = document.getElementById('mine-status'); if (status) status.textContent = '';
}
function renderMinesweeper() {
  const el = document.getElementById('mine-grid'); if (!el || !mineState) return;
  const { grid, rows, cols } = mineState;
  el.innerHTML = '';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const cell = grid[r][c];
    const div = document.createElement('div');
    div.style.cssText = 'width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:bold; cursor:pointer; user-select:none;';
    if (cell.revealed) {
      div.style.background = cell.mine ? '#ff4d6d' : '#3c4043';
      div.style.color = ['', '#4cc2ff','#34e89e','#ff9f43','#a78bfa','#ffd54f','#ff4d6d','#fff','#888'][cell.adj] || '#fff';
      div.textContent = cell.mine ? '💣' : (cell.adj || '');
    } else {
      div.style.background = '#555';
      div.textContent = cell.flagged ? '🚩' : '';
      div.onclick = () => revealMineCell(r, c);
      div.oncontextmenu = (e) => { e.preventDefault(); toggleMineFlag(r, c); };
    }
    el.appendChild(div);
  }
  const counter = document.getElementById('mine-counter'); if (counter) counter.textContent = `💣 ${mineState.mines - mineState.flagsUsed}`;
}
function revealMineCell(r, c) {
  if (mineState.over) return;
  const cell = mineState.grid[r][c];
  if (cell.revealed || cell.flagged) return;
  cell.revealed = true;
  if (cell.mine) {
    mineState.over = true;
    mineState.grid.forEach(row => row.forEach(cc => { if (cc.mine) cc.revealed = true; }));
    document.getElementById('mine-status').textContent = '💥 Boom. Try again.';
    renderMinesweeper();
    return;
  }
  if (cell.adj === 0) {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const rr = r+dr, cc2 = c+dc;
      if (rr>=0 && rr<mineState.rows && cc2>=0 && cc2<mineState.cols && !mineState.grid[rr][cc2].revealed) revealMineCell(rr, cc2);
    }
  }
  checkMineWin();
  renderMinesweeper();
}
function toggleMineFlag(r, c) {
  if (mineState.over) return;
  const cell = mineState.grid[r][c];
  if (cell.revealed) return;
  cell.flagged = !cell.flagged;
  mineState.flagsUsed += cell.flagged ? 1 : -1;
  renderMinesweeper();
}
function checkMineWin() {
  const allSafeRevealed = mineState.grid.every(row => row.every(c => c.mine || c.revealed));
  if (allSafeRevealed) {
    mineState.over = true;
    document.getElementById('mine-status').textContent = '🎉 You win!';
    maybeUnlockAchievement('minesweeper_win', 'Won a game of Minesweeper');
  }
}

let mediaRecorder = null, recordedChunks = [];
async function startRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Microphone capture is not supported here.'); return; }

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  else if (val === 'back') s.disp = s.disp.length > 1 ? s.disp.slice(0, -1) : '0';
  else if (val === '=') { if (s.op && s.prev !== null) { try { s.disp = String(Function('"use strict";return (' + s.prev + s.op + s.disp + ')')()); } catch(e) { s.disp = 'Error'; } } s.prev = null; s.op = null; }
  else if (['+', '-', '*', '/'].includes(val)) { s.prev = s.disp; s.op = val; s.disp = '0'; }
  else { s.disp = s.disp === '0' ? val : s.disp + val; }
  disp.textContent = s.disp;
}

// --- App Logic: Task Manager ---
function renderTaskMgr() {
  const list = document.getElementById('taskmgr-list');
  if (!list) return;
  list.innerHTML = Object.keys(openWindows).map(id => `<div class="taskmgr-row"><span>${escapeHtml(openWindows[id].title)}</span><button class="taskmgr-kill" data-kill="${id}">End Task</button></div>`).join('') || '<p style="color:#999;">No running processes.</p>';
  list.querySelectorAll('[data-kill]').forEach(b => b.onclick = () => { closeWindow(b.dataset.kill); renderTaskMgr(); });
}

// --- Window Manager ---
function focusWindow(app) { 
  Object.keys(openWindows).forEach(a => { 
    openWindows[a].element.style.zIndex = 50; 
    const tb = document.getElementById(`tb-${a}`); if (tb) tb.classList.remove('active'); 
  }); 
  if (openWindows[app]) { openWindows[app].element.style.zIndex = ++zCounter; const tb = document.getElementById(`tb-${app}`); if (tb) tb.classList.add('active'); }
}
function closeWindow(app) { 
  if(openWindows[app]){ openWindows[app].element.remove(); const tb = document.getElementById(`tb-${app}`); if (tb) tb.remove(); delete openWindows[app]; 
  } 
}
function minimizeWindow(app) { 
  const w = openWindows[app]; if (!w) return;
  if (w.minimized) { w.element.style.display = 'flex'; w.minimized = false; focusWindow(app); } 
  else { w.element.style.display = 'none'; w.minimized = true; const tb = document.getElementById(`tb-${app}`); if (tb) tb.classList.remove('active'); } 
}
function maximizeWindow(app) { 
  const w = openWindows[app]; if (!w) return;
  if (!w.maximized) { w.prevRect = { left: w.element.style.left, top: w.element.style.top, width: w.element.style.width, height: w.element.style.height }; w.element.style.left = '0'; w.element.style.top = '0'; w.element.style.width = '100%'; w.element.style.height = 'calc(100% - 60px)'; w.element.style.borderRadius = '0'; w.maximized = true; } 
  else { Object.assign(w.element.style, w.prevRect); w.element.style.borderRadius = '8px'; w.maximized = false; } 
}
let dragState = null;
function initDrag(e, app) {
  if (e.target.classList.contains('window-btn') || e.target.closest('.window-btn')) return;
  if (openWindows[app].maximized) return;
  dragState = { app, startX: e.clientX, startY: e.clientY, startLeft: parseInt(openWindows[app].element.style.left), startTop: parseInt(openWindows[app].element.style.top) };
  document.addEventListener('mousemove', doDrag); document.addEventListener('mouseup', stopDrag);
}
function doDrag(e) {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
  const w = openWindows[dragState.app].element;
  const newLeft = Math.max(-w.offsetWidth + 80, Math.min(window.innerWidth - 80, dragState.startLeft + dx));
  const newTop = Math.max(0, Math.min(window.innerHeight - 60, dragState.startTop + dy));
  w.style.left = newLeft + 'px'; w.style.top = newTop + 'px';
}
function stopDrag() { dragState = null; document.removeEventListener('mousemove', doDrag); document.removeEventListener('mouseup', stopDrag); }
</script>
